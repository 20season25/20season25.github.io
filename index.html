CMDS.ls = { d:"列表", f:function(args){
  var t = args[0] || S.cwd;
  var path = resolvePath(t);
  if(!path){ print("ls: 无法访问 " + esc(t), "err"); return; }
  if(path === "~"){
    print(homeChildren().map(function(x){ return x.endsWith("/") ? '<span class="k">'+x+'</span>' : x; }).join("   "));
  } else if(path === "~/articles"){
    var c = articleChildren();
    print(c.length ? c.join("   ") : "(空)");
  } else if(LINKS[path.slice(2)]){
    print(LINKS[path.slice(2)].label);
  } else if(path === "~/" ){
    print(homeChildren().join("   "));
  } else { print("ls: 无法访问 " + esc(t), "err"); }
}};
CMDS.pwd = { d:"当前路径", f:function(){ print(S.cwd); } };
function resolvePath(t){
  if(!t || t === "~" || t === "~/" ) return "~";
  if(t === "..") return "~";
  if(t === "articles" || t === "~/articles" || t === "./articles") return "~/articles";
  var base = t.replace(/^~\//,"").replace(/^\.\//,"").replace(/\/$/,"");
  if(LINKS[base]) return "~/" + base;
  if(base === "articles") return "~/articles";
  return null;
}
CMDS.cd = { d:"切换目录", f:function(args){
  var t = args[0] || "~";
  var p = resolvePath(t);
  if(!p){ print("cd: 没有那个文件或目录: " + esc(t), "err"); return; }
  if(LINKS[p.slice(2)]){
    var L = LINKS[p.slice(2)];
    print("正在打开 " + L.label + " …", "dim");
    setTimeout(function(){ location.href = L.to; }, 350);
    return;
  }
  S.cwd = p;
  document.getElementById("prompt").textContent = "guest@softslow:" + S.cwd + "$";
}};
CMDS.cat = { d:"读文件", f:function(args){

  if(t === "about.md" || p === "~" && t === "about.md"){
    print(WHO_TEXT); return;

  if(t === "now.md"){ print(NOW_TEXT); return; }

    var slug = m[1];
    var a = (S.articles||[]).filter(function(x){return x.slug===slug;})[0];

  print("cat: 没有那个文件: " + esc(t), "err");
}};

function wrapCJK(t, n){
  var out = [], cur = "";
  for(var i=0;i<t.length;i++){ cur += t[i]; if(cur.length >= n){ out.push(cur); cur = ""; } }
  if(cur) out.push(cur);
  if(!out.length) out = [""];
  return out;
}
CMDS.cowsay = { d:"牛说话", f:function(args){
  var t = (args.join(" ") || "moo~").slice(0, 120);
  var lines = wrapCJK(t, 16);
  var w = Math.max.apply(null, lines.map(function(l){ return l.length; }));
  function pad(l){ return l + " ".repeat(w - l.length); }
  var out = [" " + "_".repeat(w+2)];
  if(lines.length === 1) out.push("< " + pad(t) + " >");
  else {
    out.push("/ " + pad(lines[0]) + " \\");
    for(var i=1;i<lines.length-1;i++) out.push("| " + pad(lines[i]) + " |");
    out.push("\ " + pad(lines[lines.length-1]) + " /");
  }
  out.push(" " + "-".repeat(w+2));
  out.push("        \   ^__^");
  out.push("         \  (oo)\_______");
  out.push("            (__)\       )\/\\");
  out.push("                ||----w |");
  out.push("                ||     ||");
  print(esc(out.join("
")));
}};

function run(line){
  line = line.trim();
  printCmd(line);
  if(!line) return;
  S.hist.push(line);
  if(S.hist.length > 200) S.hist.shift();
  localStorage.setItem("term.hist", JSON.stringify(S.hist));
  S.hIdx = -1;
  var parts = line.split(/\s+/);
  var name = parts[0], args = parts.slice(1);
  var c = CMDS[name];
  if(c) c.f(args);
  else print("sh: 未找到命令: " + esc(name) + '（输入 <a href="javascript:void(0)" onclick="term.run(\'help\')">help</a> 查看可用命令）', "err");
}
window.term = { run: run };   // 供测试与移动端按钮使用

/* ============ 输入框 ============ */
$cmd.addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    var v = $cmd.value; $cmd.value = ""; run(v);
  } else if(e.key === "ArrowUp"){
    e.preventDefault();
    if(!S.hist.length) return;
    if(S.hIdx === -1) S.hIdx = S.hist.length;
    S.hIdx = Math.max(0, S.hIdx - 1);
    $cmd.value = S.hist[S.hIdx] || "";
  } else if(e.key === "ArrowDown"){
    e.preventDefault();
    if(S.hIdx === -1) return;
    S.hIdx = Math.min(S.hist.length, S.hIdx + 1);
    $cmd.value = S.hist[S.hIdx] || "";
    if(S.hIdx >= S.hist.length){ S.hIdx = -1; $cmd.value = ""; }
  } else if(e.key === "Tab"){
    e.preventDefault();
    tabComplete();
  } else if(e.key === "l" && e.ctrlKey){
    e.preventDefault(); $cmd.value = ""; run("clear");
  }
});
function tabComplete(){
  var v = $cmd.value, parts = v.split(/\s+/);
  var names;
  if(parts.length <= 1){ names = CMD_NAMES; }
  else if(parts[0] === "cat" || parts[0] === "read"){
    names = parts[0] === "cat" ? ["about.md","now.md"].concat(articleChildren()) : articleChildren();
  } else if(parts[0] === "cd"){ names = homeChildren(); }
  else return;
  var last = parts[parts.length-1];
  var hits = names.filter(function(n){ return n.indexOf(last) === 0; });
  if(!hits.length) return;
  if(hits.length === 1){
    parts[parts.length-1] = hits[0];
    $cmd.value = parts.join(" ");
  } else {
    // 公共前缀
    var pre = hits[0];
    hits.forEach(function(h){ while(!h.startsWith(pre)) pre = pre.slice(0,-1); });
    parts[parts.length-1] = pre;
    $cmd.value = parts.join(" ");
    printCmd(v);
    print(hits.join("   "));
  }
}
