<!doctype html>

<head>
<meta charset="utf-8">

<title>Season · 在做的小产品与写字的地方</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23111'/%3E%3Ctext x='50' y='72' font-size='62' text-anchor='middle' fill='%23fff' font-family='serif'%3ES%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#faf9f6;--ink:#1a1a18;--sub:#6b6a66;--line:#e4e1da;--card:#ffffff;
--accent:#b32d2d;--accent-ink:#8f1f1f;--quote-bg:#f4f2ec}
@media (prefers-color-scheme:dark){:root{--bg:#141412;--ink:#e8e6e1;--sub:#9a988f;
--line:#2c2b27;--card:#1c1c19;--accent:#e05a4e;--accent-ink:#e8837a;--quote-bg:#1f1e1a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
font:16px/1.9 "Source Han Serif SC","Noto Serif SC","Songti SC",STSong,SimSun,Georgia,serif}
a{color:inherit}
.wrap{max-width:42rem;margin:0 auto;padding:0 1.25rem}
header{padding:4.2rem 0 1rem;text-align:center}
.avatar{width:72px;height:72px;border-radius:50%;background:#111;color:#fff;
display:inline-flex;align-items:center;justify-content:center;
font-size:2.1rem;font-family:Georgia,"Songti SC",serif;margin-bottom:1.1rem}
h1{font-size:1.9rem;margin:.2rem 0 .5rem;letter-spacing:.04em}
.bio{color:var(--sub);font-size:.98rem;margin:0}
.bio b{color:var(--accent-ink);font-weight:700}
h2{font-size:.85rem;font-family:system-ui,sans-serif;letter-spacing:.18em;
color:var(--sub);margin:2.6rem 0 1rem;border-bottom:1px solid var(--line);padding-bottom:.5rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
.grid.single{grid-template-columns:1fr}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
a.item{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);
border-radius:12px;padding:1.05rem 1.15rem;transition:border-color .15s}
a.item:hover{border-color:var(--accent)}
.item .t{font-weight:700;font-size:1.02rem;display:flex;align-items:center;gap:.5em}
.item .t .ico{font-style:normal;font-size:1.15em}
.item .d{color:var(--sub);font-size:.86rem;margin-top:.3rem;line-height:1.7}
.item .u{font-family:system-ui,sans-serif;font-size:.72rem;color:var(--accent);
margin-top:.45rem;letter-spacing:.05em}
.item.pending{border-style:dashed;opacity:.75}
.rows{display:flex;flex-direction:column;gap:.55rem}
a.rowitem{display:flex;justify-content:space-between;align-items:baseline;text-decoration:none;
background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.75rem 1.05rem}
a.rowitem:hover{border-color:var(--accent)}
.rowitem .l{font-weight:700;font-size:.98rem}
.rowitem .r{font-family:system-ui,sans-serif;font-size:.78rem;color:var(--sub)}
footer{margin:3.5rem 0 3rem;text-align:center;color:var(--sub);
font-family:system-ui,sans-serif;font-size:.8rem}
footer a{color:var(--sub)}
</style>
</head>
<body>

<header>

  相信 <b>「认知增量」</b>——不复述新闻，只更新认知。</p>
</header>

<h2>在做的产品</h2>
<div class="grid single">
  <a class="item" href="https://softslow.cloud/">
    <div class="t"><i class="ico">🐈</i>卷腹猫</div>
    <div class="d">AI 健康打卡 Agent：每日打卡、体重趋势、圈子排行榜，LLM 复盘你的坚持。</div>
    <div class="u">softslow.cloud</div>
  </a>
</div>

<h2>写字的地方</h2>
<div class="rows">
  <a class="rowitem" href="https://20season25.github.io/blog/">
    <span class="l">认知增量 · 博客</span>
    <span class="r">AI 深度解读 · 每日更新</span>
  </a>
  <a class="rowitem" href="https://20season25.github.io/blog/rss.xml">
    <span class="l">RSS 订阅</span>
    <span class="r">全文输出</span>
  </a>
  <a class="rowitem" href="#" onclick="return false" title="公众号名待确认">
    <span class="l">微信公众号 · 认知增量</span>

</div>

<footer>
© 2026 Season · 本页由 GitHub Pages 托管 · <a href="https://20season25.github.io/blog/">博客</a>

</html>
