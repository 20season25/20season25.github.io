# softslow.cloud 站点路由
#   /                  个人主页      → /var/www/home
#   /coach             卷腹猫        → 反代 127.0.0.1:8000
#   /api/  /assets/    卷腹猫接口与静态资源（SPA 绝对路径）
#   /technews/         科技情报      → /var/www/blog/aiblog
#   /photos/dongdong/  摄影相册      → /var/www/photos/dongdong
#   /photos/dongdong/upload/  上传入口（Basic 认证 + 限流）→ 127.0.0.1:8088
#   /breath/           呼吸          → /var/www/home/breath

# 上传限流（每 IP 每分钟 6 次，突发 6）
limit_req_zone $binary_remote_addr zone=dongupload:1m rate=6r/m;
# 呼吸记录限流（每 IP 每分钟 10 次）
limit_req_zone $binary_remote_addr zone=breathpost:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name softslow.cloud;
    client_max_body_size 8m;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name softslow.cloud;
    client_max_body_size 8m;

    ssl_certificate     /etc/letsencrypt/live/softslow.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/softslow.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── 卷腹猫：接口
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── 卷腹猫：前端静态资源（SPA 里是 /assets/... 绝对路径，必须留在根）
    location /assets/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── 卷腹猫：页面
    # 不剥前缀（proxy_pass 不带 URI）：Go 端对未知路径统一回退 index.html，
    # 因此 /coach、/coach/、/coach/xxx 都能正常出页面，也不会产生 // 双斜杠重定向。
    location /coach {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── 科技情报（博客文章 + 相册 + RSS，站点根在这里）
    location = /technews { return 301 /technews/; }
    location /technews/ {
        alias /var/www/blog/aiblog/;
        index index.html;
    }

    # ── 旧 /blog 地址 301 到 /technews（保留老链接与 RSS 订阅者）
    location = /blog { return 301 /technews/; }
    location /blog/ { rewrite ^/blog/(.*)$ /technews/$1 permanent; }

    # ── 摄影相册（独立站点，不属于 /technews）
    location = /photos { return 301 /photos/dongdong/; }
    location = /photos/ { return 301 /photos/dongdong/; }
    location = /photos/dongdong { return 301 /photos/dongdong/; }
    # 上传入口：Basic 认证 + 限流；仅冬冬持有账号
    location = /photos/dongdong/upload { return 301 /photos/dongdong/upload/; }
    location /photos/dongdong/upload/ {
        auth_basic "Dongdong Album";
        auth_basic_user_file /etc/nginx/.htpasswd_dongdong;
        limit_req zone=dongupload burst=6 nodelay;
        limit_req_status 429;
        client_max_body_size 16m;
        proxy_pass http://127.0.0.1:8088/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    location /photos/dongdong/ {
        alias /var/www/photos/dongdong/;
        index index.html;
    }

    # ── 呼吸
    location = /breath { return 301 /breath/; }
    location /breath/ {
        alias /var/www/home/breath/;
        index index.html;
    }
    # 呼吸记录入口：Basic 认证 + 限流；仅自己持有账号
    location = /breath/post { return 301 /breath/post/; }
    location /breath/post/ {
        auth_basic "Breath";
        auth_basic_user_file /etc/nginx/.htpasswd_breath;
        limit_req zone=breathpost burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 16m;
        proxy_pass http://127.0.0.1:8089/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    # 呼吸照片：只读
    location /breath/photos/ {
        alias /var/www/home/breath/photos/;
        expires 30d;
    }

    # ── 个人主页
    location / {
        root /var/www/home;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
