# softslow.cloud 站点路由
#   /            个人主页      → /var/www/home
#   /coach       卷腹猫        → 反代 127.0.0.1:8000
#   /api/        卷腹猫接口    → 反代 127.0.0.1:8000（SPA 使用绝对路径）
#   /assets/     卷腹猫静态资源 → 反代 127.0.0.1:8000（SPA 使用绝对路径）
#   /blog/       认知增量博客  → /var/www/blog/aiblog
#   /breath      呼吸          → /var/www/home/breath
#   /technews    科技情报      → /var/www/home/technews（AI喇叭，目标待定）
server {
    listen 80;
    listen [::]:80;
    server_name softslow.cloud;
    client_max_body_size 8m;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name softslow.cloud;
    client_max_body_size 8m;

    ssl_certificate     /etc/letsencrypt/live/softslow.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/softslow.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── 卷腹猫：接口
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── 卷腹猫：前端静态资源（SPA 里是 /assets/... 绝对路径，必须留在根）
    location /assets/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── 卷腹猫：页面
    # 不剥前缀（proxy_pass 不带 URI）：Go 端对未知路径统一回退 index.html，
    # 因此 /coach、/coach/、/coach/xxx 都能正常出页面，也不会产生 // 双斜杠重定向。
    location /coach {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── 科技情报（博客文章 + 相册 + RSS，站点根在这里）
    location = /technews { return 301 /technews/; }
    location /technews/ {
        alias /var/www/blog/aiblog/;
        index index.html;
    }

    # ── 旧 /blog 地址 301 到 /technews（保留老链接与 RSS 订阅者）
    location = /blog { return 301 /technews/; }
    location /blog/ { rewrite ^/blog/(.*)$ /technews/$1 permanent; }

    # ── 呼吸
    location = /breath { return 301 /breath/; }
    location /breath/ {
        alias /var/www/home/breath/;
        index index.html;
    }

    # ── 个人主页
    location / {
        root /var/www/home;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
