<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>访客留言簿 · softslow.cloud</title>
<meta name="description" content="给 Season 留句话。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23111'/%3E%3Ctext x='50' y='72' font-size='58' text-anchor='middle' fill='%23fff' font-family='serif'%3E%E8%A8%80%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#fbfaf7;--ink:#1f1e1a;--sub:#77756e;--line:#e6e3dc;--accent:#b32d2d;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#131312;--ink:#e6e4df;--sub:#8f8d85;
--line:#2a2a26;--accent:#e05a4e;--card:#1b1b19}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
font:16px/1.9 "Source Han Serif SC","Noto Serif SC","Songti SC",STSong,SimSun,Georgia,serif}
.wrap{max-width:36rem;margin:0 auto;padding:3rem 1.25rem 4rem}
.head{text-align:center;margin-bottom:2rem}
h1{font-size:1.7rem;letter-spacing:.2em;margin:0 0 .4rem;font-weight:400}
.sub{color:var(--sub);font-size:.88rem;margin:0}
label{display:block;font-size:.8rem;color:var(--sub);font-family:system-ui,sans-serif;
letter-spacing:.06em;margin:1.2rem 0 .35rem}
input,textarea{width:100%;box-sizing:border-box;background:var(--card);border:1px solid var(--line);
border-radius:8px;color:var(--ink);padding:.6rem .7rem;font:inherit;font-size:.92rem}
button{margin-top:1.4rem;padding:.7rem 2.2rem;border:0;border-radius:8px;background:var(--accent);
color:#fff;font:inherit;font-size:.92rem;font-weight:600;cursor:pointer}
button:disabled{opacity:.5}
.hp{position:absolute;left:-9999px}
#msg{margin-top:.9rem;font-size:.85rem;min-height:1.4em;font-family:system-ui,sans-serif}
.ok{color:var(--accent)}.err{color:var(--accent)}
.entry{border-bottom:1px solid var(--line);padding:1rem .2rem}
.entry .who{font-family:system-ui,sans-serif;font-size:.78rem;color:var(--sub);
display:flex;justify-content:space-between;margin-bottom:.3rem}
.entry .who b{color:var(--ink)}
.entry .text{white-space:pre-wrap;word-break:break-word;font-size:.95rem}
.empty{text-align:center;color:var(--sub);padding:2rem 0;font-size:.9rem}
.back{text-align:center;margin-top:3rem}
a{color:var(--sub);text-decoration:none;font-family:system-ui,sans-serif;font-size:.8rem}
a:hover{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>留言簿</h1>
    <p class="sub">给 Season 留句话。乱写的会被删，认真的都会被看到。</p>
  </div>

  <form id="f">
    <input class="hp" name="website" tabindex="-1" autocomplete="off">
    <label>怎么称呼你（可留空）</label>
    <input id="name" maxlength="30" placeholder="路人">
    <label>想说的话</label>
    <textarea id="text" rows="3" maxlength="200" placeholder="200 字以内" required></textarea>
    <button type="submit" id="btn">留下</button>
    <div id="msg"></div>
  </form>

  <div id="list"><div class="empty">读取中…</div></div>

  <div class="back"><a href="/">← 回到主页</a> · <a href="/technews/">科技情报</a></div>
</div>

<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var msg=document.getElementById('msg');
function loadList(){
  fetch('api/list?v='+Date.now()).then(function(r){return r.json();}).then(function(items){
    var el=document.getElementById('list');
    if(!items.length){el.innerHTML='<div class="empty">还没有人留言——你是第一个。</div>';return;}
    el.innerHTML=items.map(function(e){
      return '<div class="entry"><div class="who"><b>'+esc(e.name||'路人')+'</b><span>'+esc(e.ts)+'</span></div>'
        +'<div class="text">'+esc(e.text)+'</div></div>';
    }).join('');
  }).catch(function(){document.getElementById('list').innerHTML='<div class="empty">读取失败，刷新试试</div>';});
}
document.getElementById('f').addEventListener('submit',function(e){
  e.preventDefault();
  var btn=document.getElementById('btn');
  var body={
    name:document.getElementById('name').value.trim(),
    text:document.getElementById('text').value.trim(),
    website:document.getElementById('f').website.value   // 蜜罐
  };
  if(!body.text){msg.className='err';msg.textContent='写点什么都好，但得写';return;}
  btn.disabled=true;msg.className='';msg.textContent='留下中…';
  fetch('api/add',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)})
    .then(function(r){return r.json();})
    .then(function(d){
      if(!d.ok)throw new Error(d.error||'失败');
      msg.className='ok';msg.textContent='留下了。谢谢。';
      document.getElementById('text').value='';loadList();
    })
    .catch(function(err){msg.className='err';msg.textContent='失败：'+(err&&err.message?err.message:err);})
    .then(function(){btn.disabled=false;});
});
loadList();
</script>
</body>
</html>
